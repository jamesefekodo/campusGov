services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: mybackend

    ports:
      - "8001:8000"

    volumes:
      - .:/app

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: campus_gov
      DB_USERNAME: laravel
      DB_PASSWORD: password

    command:
      - sh
      - -c
      - |
          until mysqladmin ping -h db -ularavel -ppassword --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

          php artisan key:generate --force
          php artisan migrate --force
          php artisan serve --host=0.0.0.0 --port=8000

    networks:
      - application

  db:
    image: mysql:8.4

    container_name: mysql

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campus_gov
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password

    volumes:
      - ./data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - application

networks:
  application:
    driver: bridge
